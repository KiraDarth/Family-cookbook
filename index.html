<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14110F">
<title>Unser Kochbuch</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,600&family=Manrope:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: a calm recipe shelf. Cards on the overview; on the recipe page ingredients sit beside the steps on wide screens and stack on the phone. */
/* Abendküche: dunkler Grund, Gold, Glasflächen. Die Tagvariante «Morgenküche» folgt später. */
:root {
  --bg: #14110F;
  --surface: #201B17;
  --glass: rgba(28, 24, 20, .5);
  --ink: #EFE7DC;
  --muted: #A89B8A;
  --line: rgba(255, 255, 255, .1);
  --accent: #E0A84E;
  --gold: #E0A84E;
  --gold2: #F3D9A9;
  --on-gold: #20160A;
  --accent-soft: rgba(224, 168, 78, .16);
  --ok: #8FCBA8; --ok-soft: rgba(143, 203, 168, .16);
  --warn: #E8C463; --warn-soft: rgba(232, 196, 99, .15);
  --danger: #F08C84; --danger-soft: rgba(240, 140, 132, .16);
  --add: #8FCBA8; --del: #F08C84;
  --t1: #E9A24C; --t2: #7DB6DB; --t3: #E58585; --t4: #A6C878; --t5: #C9A886; --t6: #E08CC0; --t7: #6CC9C3; --t8: #A99CE8;
  --font-display: "Cormorant Garamond", Georgia, serif;
  --font-body: "Manrope", "Segoe UI", system-ui, -apple-system, sans-serif;
  --radius: 18px;
  --shadow: 0 14px 30px rgba(0, 0, 0, .38);
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--ink);
  font-family: var(--font-body); font-size: 17px; line-height: 1.55;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0 48px;
}
.wrap { max-width: 1080px; margin: 0 auto; }
h1, h2, h3 { font-family: var(--font-display); text-wrap: balance; line-height: 1.15; margin: 0; }
h1 { font-size: clamp(1.9rem, 5vw, 2.6rem); font-weight: 700; letter-spacing: -.01em; }
h2 { font-size: 1.3rem; font-weight: 700; }
h3 { font-size: 1.15rem; font-weight: 600; }
a { color: inherit; }
button, input, textarea, select { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
.muted { color: var(--muted); }
.eyebrow { font-size: .78rem; text-transform: uppercase; letter-spacing: .09em; color: var(--muted); font-weight: 700; }

/* top bar */
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
.top {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg);
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
  padding-block: 14px; border-bottom: 1px solid var(--line); margin-bottom: 24px;
}
.brand { font-family: var(--font-display); font-weight: 700; font-size: 1.2rem; text-decoration: none; display: flex; align-items: center; gap: 10px; }
.brand-mark { width: 28px; height: 28px; border-radius: 50%; background: var(--accent); display: grid; place-items: center; }
.brand-mark svg { width: 16px; height: 16px; }

/* buttons */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  min-height: 44px; padding: 0 16px; border-radius: 999px; border: 1px solid var(--line);
  background: var(--surface); cursor: pointer; text-decoration: none; font-weight: 700; font-size: .95rem;
}
.btn:hover { border-color: var(--muted); }
.btn.primary { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.btn.accent { background: var(--accent); color: var(--surface); border-color: var(--accent); }
.btn.ok { background: var(--ok); color: var(--surface); border-color: var(--ok); }
.btn.danger { color: var(--danger); }
.btn.danger.solid { background: var(--danger); color: var(--surface); border-color: var(--danger); }
.btn:disabled { opacity: .55; cursor: wait; }
.btn.small { min-height: 36px; padding: 0 12px; font-size: .88rem; }
.linkish { background: none; border: 0; padding: 0; color: var(--accent); font-weight: 700; cursor: pointer; text-decoration: underline; text-underline-offset: 3px; }

/* overview */
.intro { display: flex; flex-wrap: wrap; align-items: end; justify-content: space-between; gap: 16px; margin-bottom: 18px; }
.intro p { margin: 6px 0 0; }
.search { flex: 1 1 280px; max-width: 420px; position: relative; }
.search input {
  width: 100%; min-height: 48px; border-radius: 999px; border: 1px solid var(--line);
  background: var(--surface); padding: 0 18px 0 44px;
}
.search svg { position: absolute; left: 16px; top: 50%; transform: translateY(-50%); width: 18px; height: 18px; color: var(--muted); }
.filters { display: flex; flex-direction: column; gap: 12px; margin-bottom: 22px; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip {
  display: inline-flex; align-items: center; gap: 8px; min-height: 40px; padding: 0 14px;
  border-radius: 999px; border: 1px solid var(--line); background: var(--surface); cursor: pointer; font-size: .95rem;
}
.chip[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.chip .n { font-variant-numeric: tabular-nums; color: var(--muted); font-size: .85rem; }
.chip[aria-pressed="true"] .n { color: inherit; opacity: .75; }
.dot { width: 10px; height: 10px; border-radius: 50%; background: var(--dot, var(--muted)); flex: none; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 999px; background: var(--surface); padding: 3px; gap: 2px; }
.seg button { border: 0; background: none; min-height: 34px; padding: 0 14px; border-radius: 999px; cursor: pointer; font-size: .9rem; }
.seg button[aria-pressed="true"] { background: var(--accent-soft); color: var(--accent); font-weight: 700; }
.filter-row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: space-between; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 290px), 1fr)); gap: 16px; }
.card {
  display: flex; flex-direction: column; gap: 10px; padding: 18px; border-radius: var(--radius);
  background: var(--surface); border: 1px solid var(--line); text-decoration: none; box-shadow: var(--shadow);
  min-width: 0; transition: border-color .15s, transform .15s;
}
.card:hover { border-color: var(--muted); transform: translateY(-1px); }
.card p { margin: 0; color: var(--muted); font-size: .95rem; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.card-top { display: flex; justify-content: space-between; align-items: center; gap: 8px; font-size: .85rem; }
.card .meta { font-size: .85rem; color: var(--muted); margin-top: auto; padding-top: 4px; }
.pill { display: inline-flex; align-items: center; gap: 6px; border-radius: 999px; padding: 2px 10px; font-size: .8rem; font-weight: 700; letter-spacing: .02em; }
.pill.draft { background: var(--warn-soft); color: var(--warn); }
.pill.ok { background: var(--ok-soft); color: var(--ok); }
.pill.var { background: var(--accent-soft); color: var(--accent); }
.tags { display: flex; flex-wrap: wrap; gap: 6px 12px; font-size: .88rem; }
.tag { display: inline-flex; align-items: center; gap: 6px; }
.tag .dot { width: 8px; height: 8px; }
.empty { padding: 36px 24px; border: 1.5px dashed var(--line); border-radius: var(--radius); text-align: center; color: var(--muted); }
.empty h2 { color: var(--ink); margin-bottom: 8px; }
.empty p { max-width: 52ch; margin: 0 auto 16px; }
.foot { margin-top: 40px; padding-top: 18px; border-top: 1px solid var(--line); display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: space-between; font-size: .9rem; color: var(--muted); }

/* recipe page */
.crumbs { margin-bottom: 16px; }
.crumbs a { text-decoration: none; color: var(--muted); font-weight: 700; }
.crumbs a:hover { color: var(--ink); }
.recipe-head { display: flex; flex-direction: column; gap: 12px; margin-bottom: 22px; }
.recipe-head .lede { margin: 0; font-size: 1.1rem; color: var(--muted); max-width: 62ch; }
.status-row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; font-size: .9rem; }
.hero { position: relative; margin: 0 0 18px; border-radius: var(--radius); overflow: hidden; background: var(--line); aspect-ratio: 3 / 2; max-height: 460px; width: 100%; }
.hero img { width: 100%; height: 100%; object-fit: cover; display: block; }
.hero .hintbox { position: absolute; max-width: min(60%, 260px); padding: 12px 14px; background: #EBD6E0; color: #2B2826; border: 3px solid #fff; border-radius: 18px; font-size: .92rem; line-height: 1.4; font-weight: 700; }
.hero .hintbox.unten-rechts { right: 14px; bottom: 14px; } .hero .hintbox.unten-links { left: 14px; bottom: 14px; }
.hero .hintbox.oben-rechts { right: 14px; top: 14px; } .hero .hintbox.oben-links { left: 14px; top: 14px; }
.photo-edit { display: flex; gap: 14px; align-items: center; flex-wrap: wrap; }
.photo-edit img { width: 132px; height: 88px; object-fit: cover; border-radius: 10px; background: var(--line); }
.field select { min-height: 44px; border: 1px solid var(--line); border-radius: 10px; padding: 0 10px; background: var(--surface); color: var(--ink); font: inherit; }
.facts { display: flex; flex-wrap: wrap; gap: 8px 28px; margin: 4px 0 0; }
.facts div { display: flex; flex-direction: column; }
.facts dt { font-size: .75rem; text-transform: uppercase; letter-spacing: .09em; color: var(--muted); font-weight: 700; }
.facts dd { margin: 0; font-weight: 700; }
.note-box { border-radius: var(--radius); padding: 14px 18px; margin-bottom: 20px; display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: space-between; }
.note-box p { margin: 0; flex: 1 1 320px; }
.note-box.draft { background: var(--warn-soft); color: var(--ink); }
.note-box.variant { background: var(--accent-soft); }
.note-box b { display: block; }
.cols { display: grid; grid-template-columns: minmax(0, 340px) minmax(0, 1fr); gap: 24px; align-items: start; }
@media (max-width: 760px) { .cols { grid-template-columns: minmax(0, 1fr); } }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 20px; min-width: 0; }
.panel h2 { margin-bottom: 12px; }
.ing-panel { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 84px); }
@media (max-width: 760px) { .ing-panel { position: static; } }
.stepper { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; padding-bottom: 14px; border-bottom: 1px solid var(--line); }
.stepper button { width: 40px; height: 40px; border-radius: 50%; border: 1px solid var(--line); background: var(--bg); cursor: pointer; font-size: 1.3rem; line-height: 1; }
.stepper .val { font-variant-numeric: tabular-nums; font-weight: 700; font-size: 1.15rem; min-width: 2ch; text-align: center; }
.stepper .reset { margin-left: auto; font-size: .85rem; }
.ing-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
.ing-list li { border-bottom: 1px dotted var(--line); }
.ing-list li:last-child { border-bottom: 0; }
.ing-list label { display: grid; grid-template-columns: 22px 5.2rem minmax(0, 1fr); gap: 8px; align-items: baseline; padding: 8px 0; cursor: pointer; }
.ing-list input { accent-color: var(--accent); width: 18px; height: 18px; transform: translateY(3px); }
.ing-list .amt { font-variant-numeric: tabular-nums; font-weight: 700; color: var(--accent); }
.ing-list .nm small { color: var(--muted); }
.ing-list .amt .alt { display: block; font-weight: 400; font-size: .8rem; color: var(--muted); line-height: 1.25; }
.unit-switch { display: inline-flex; border: 1px solid var(--line); border-radius: 999px; padding: 2px; margin: 0 0 12px; background: var(--bg); }
.unit-switch button { border: 0; background: transparent; padding: 5px 12px; border-radius: 999px; font: inherit; font-size: .85rem; cursor: pointer; color: var(--muted); }
.unit-switch button[aria-pressed="true"] { background: var(--accent); color: #fff; font-weight: 700; }
.ing-list li.done .amt, .ing-list li.done .nm { text-decoration: line-through; opacity: .5; }
.ing-list li.hd { border-bottom: 0; padding: 14px 0 2px; font-family: var(--font-display); font-weight: 600; font-size: 1rem; }
.ing-list li.hd:first-child { padding-top: 0; }
.ing-list li.hd.has { display: flex; align-items: center; gap: 8px; }
.ing-list li.hd.has::before { content: ""; width: 4px; height: 1.1em; border-radius: 2px; background: var(--sec); flex: none; }
.steps-wrap { counter-reset: s; display: flex; flex-direction: column; gap: 14px; }
.step-sec.has { border-left: 4px solid var(--sec); background: color-mix(in srgb, var(--sec) 8%, transparent); border-radius: 0 12px 12px 0; padding: 12px 16px 14px 14px; }
.step-sec.plain { border-left: 4px solid var(--line); padding: 2px 0 2px 14px; }
.step-sec h3 { font-size: 1.02rem; margin-bottom: 10px; display: flex; align-items: center; gap: 8px; }
.steps-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 14px; }
.steps-list li { counter-increment: s; display: grid; grid-template-columns: 2.2rem minmax(0, 1fr); gap: 10px; }
.steps-list li::before { content: counter(s); font-family: var(--font-display); font-weight: 700; font-size: 1.35rem; color: var(--sec, var(--accent)); line-height: 1.2; font-variant-numeric: tabular-nums; }
.steps-list li p { margin: 0; max-width: 65ch; }
.tips { margin-top: 20px; }
.tips p { margin: 0 0 8px; max-width: 70ch; white-space: pre-wrap; }
.source { margin-top: 14px; font-size: .9rem; color: var(--muted); overflow-wrap: anywhere; }
.related { margin-top: 28px; }
.related h2 { margin-bottom: 12px; }
.rel-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 250px), 1fr)); gap: 12px; }
.rel-list .card { padding: 14px; gap: 6px; }
.actions { margin-top: 28px; padding-top: 18px; border-top: 1px solid var(--line); display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.confirm-row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; background: var(--danger-soft); padding: 10px 14px; border-radius: 12px; }
.wake { display: inline-flex; gap: 8px; align-items: center; font-size: .9rem; color: var(--muted); cursor: pointer; }
.wake input { accent-color: var(--accent); width: 18px; height: 18px; }

/* editor */
.form { display: flex; flex-direction: column; gap: 22px; max-width: 820px; }
.field { display: flex; flex-direction: column; gap: 6px; }
.field label, .field .lbl { font-weight: 700; font-size: .95rem; }
.field .hint { font-size: .85rem; color: var(--muted); margin: 0; }
.field input, .field textarea, .ing-row input {
  width: 100%; border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 10px 12px; min-height: 44px;
}
.field textarea { min-height: 120px; resize: vertical; line-height: 1.5; }
.row2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 180px), 1fr)); gap: 14px; }
.ing-rows { display: flex; flex-direction: column; gap: 8px; }
.ing-row { display: grid; grid-template-columns: 5rem 5rem minmax(0, 1fr) minmax(0, 1fr) 6.5rem 40px; gap: 6px; align-items: center; }
.ing-row.heading { grid-template-columns: minmax(0, 1fr) 40px; }
.ing-row.heading input { font-weight: 700; background: var(--bg); }
.ing-row button { width: 40px; height: 40px; border-radius: 50%; border: 1px solid var(--line); background: var(--bg); cursor: pointer; color: var(--muted); font-size: 1.1rem; }
@media (max-width: 620px) {
  .ing-row { grid-template-columns: 4.2rem 4.2rem minmax(0, 1fr) 40px; }
  .ing-row .i-note { grid-column: 3 / 4; grid-row: 2; }
  .ing-row .i-orig { grid-column: 1 / 3; grid-row: 2; }
  .ing-row:not(.heading) { padding-bottom: 8px; border-bottom: 1px dotted var(--line); }
}
.ing-tools { display: flex; flex-wrap: wrap; gap: 8px; }
details.bulk { border: 1px dashed var(--line); border-radius: 10px; padding: 10px 14px; }
details.bulk summary { cursor: pointer; font-weight: 700; color: var(--accent); }
details.bulk textarea { margin-top: 10px; min-height: 110px; width: 100%; border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; background: var(--surface); }
.form-msg { color: var(--danger); font-weight: 700; margin: 0; }
.form-msg:empty { display: none; }
.form-actions { display: flex; flex-wrap: wrap; gap: 10px; position: sticky; bottom: 0; background: var(--bg); padding-block: 12px calc(12px + env(safe-area-inset-bottom, 0px)); border-top: 1px solid var(--line); }
.callout { background: var(--accent-soft); border-radius: var(--radius); padding: 14px 18px; }
.callout p { margin: 0; }

/* history */
.timeline { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 14px; }
.entry { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px 18px; display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.entry-head { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: baseline; justify-content: space-between; }
.entry-head time { font-variant-numeric: tabular-nums; color: var(--muted); font-size: .9rem; }
.entry .why { margin: 0; font-style: italic; }
.diff { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 4px; font-size: .95rem; }
.diff li { display: grid; grid-template-columns: 1.4rem minmax(0, 1fr); gap: 6px; }
.diff .mk { font-weight: 700; text-align: center; }
.diff .add .mk { color: var(--add); }
.diff .del .mk { color: var(--del); }
.diff .chg .mk { color: var(--accent); }
.diff del { color: var(--del); text-decoration-thickness: 1px; }
.diff ins { color: var(--add); text-decoration: none; font-weight: 700; }
.diff .lb { color: var(--muted); }
.loading { padding: 40px 0; color: var(--muted); text-align: center; }
.key-dialog { border: 1px solid var(--line); border-radius: var(--radius); padding: 20px; max-width: min(460px, calc(100vw - 32px)); background: var(--surface); color: var(--ink); }
.key-dialog::backdrop { background: rgba(0,0,0,.35); }
.key-dialog form { display: flex; flex-direction: column; gap: 12px; }
.key-dialog h2, .key-dialog p { margin: 0; }
.key-dialog input { width: 100%; }
.site-foot { text-align: center; padding: 32px 0 24px; }
.linkbtn { background: none; border: 0; color: var(--muted); text-decoration: underline; font: inherit; font-size: .88rem; cursor: pointer; }
/* ---------- Navigation: Leiste unten (Handy) / Seitenleiste (Computer) ---------- */
.tabbar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 8; display: grid; grid-auto-flow: column; grid-auto-columns: 1fr;
  background: var(--surface); border-top: 1px solid var(--line);
  padding: 6px max(8px, env(safe-area-inset-right, 0px)) calc(8px + env(safe-area-inset-bottom, 0px)) max(8px, env(safe-area-inset-left, 0px)); }
.tab { display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 6px 0; font-size: .74rem; color: var(--muted); text-decoration: none; border-radius: 10px; }
.tab svg { width: 24px; height: 24px; }
.tab.on { color: var(--accent); font-weight: 700; }
body { padding-bottom: calc(84px + env(safe-area-inset-bottom, 0px)); }
body.editing { padding-bottom: 0; }
body.editing .tabbar { display: none; }
.side { display: none; }
.plusbtn { width: 44px; height: 44px; border-radius: 14px; background: var(--accent); color: var(--surface); display: grid; place-items: center; text-decoration: none; flex: none; }
.plusbtn svg { width: 20px; height: 20px; }
@media (min-width: 900px) {
  .tabbar, .top { display: none; }
  body { padding-bottom: 48px; }
  .side { display: flex; flex-direction: column; gap: 4px; position: fixed; top: 0; bottom: 0; left: 0; width: 236px; z-index: 8;
    background: var(--surface); border-right: 1px solid var(--line); padding: calc(20px + env(safe-area-inset-top, 0px)) 14px 20px max(14px, env(safe-area-inset-left, 0px)); overflow-y: auto; }
  .side .brand { margin: 0 6px 18px; }
  .side a, .side button.navlink { display: flex; align-items: center; gap: 12px; padding: 10px 12px; border-radius: 12px; text-decoration: none; color: var(--ink); font-weight: 700; font-size: .98rem; background: none; border: 0; cursor: pointer; text-align: left; width: 100%; }
  .side a svg, .side button.navlink svg { width: 20px; height: 20px; color: var(--muted); flex: none; }
  .side a:hover, .side button.navlink:hover { background: var(--bg); }
  .side a.on { background: var(--accent-soft); color: var(--accent); }
  .side a.on svg { color: var(--accent); }
  .side .new { background: var(--accent); color: var(--surface); justify-content: center; margin-bottom: 14px; }
  .side .new:hover { background: var(--accent); filter: brightness(1.08); }
  .side .new svg { color: var(--surface); }
  .side .sep { border-top: 1px solid var(--line); margin: 14px 6px; }
  .side .small, .side button.navlink.small { font-weight: 400; font-size: .92rem; color: var(--muted); }
  .wrap { margin-left: 236px; padding: 28px 0 0 32px; max-width: calc(1080px + 268px); }
}
.view-in { animation: viewIn .22s ease-out both; }
@keyframes viewIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
.grow { position: fixed; z-index: 30; border-radius: 16px; pointer-events: none; transition: left .28s cubic-bezier(.2,.8,.2,1), top .28s cubic-bezier(.2,.8,.2,1), width .28s cubic-bezier(.2,.8,.2,1), height .28s cubic-bezier(.2,.8,.2,1), border-radius .28s, opacity .2s; }

/* Startseite */

/* ================= Abendküche: Glas über einem festen Hintergrund ================= */
/* Hintergrund: Rezeptfoto oder warmes Kerzenlicht (wird in #stage gemalt, die Glasflächen brechen genau dieses Bild) */
#stage { position: fixed; inset: 0; width: 100vw; height: 100lvh; z-index: -1; display: block; pointer-events: none; }
body { font-size: 16.5px; line-height: 1.55; }
h1, h2, h3 { font-family: var(--font-display); font-weight: 600; letter-spacing: 0; }

h2 { font-size: 1.5rem; }
h3 { font-size: 1.25rem; }
.app-text, .vhead, .crumbs, .rhead { text-shadow: 0 1px 8px rgba(0, 0, 0, .55); }
a { color: inherit; }
::selection { background: rgba(224, 168, 78, .35); }
body::before { background: rgba(20, 17, 15, .72); -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px); }

/* GlassCard (Komponente glass-card.js): Grundaufbau */
.glass-card { isolation: isolate; }
:where(.glass-card) { position: relative; }
.glass-card > .glass-card__surface { position: absolute; inset: 0; width: 100%; height: 100%; z-index: 0; pointer-events: none; border-radius: inherit; display: block; }
:where(.glass-card > :not(.glass-card__surface)) { position: relative; }
.glass-card > :not(.glass-card__surface) { z-index: 1; }
/* Matt (Einstellung) und Grundstil: mattes Milchglas mit Unschärfe */
.gl { background: var(--glass); -webkit-backdrop-filter: blur(14px) saturate(140%); backdrop-filter: blur(14px) saturate(140%); border: 1px solid rgba(255, 255, 255, .14); box-shadow: var(--shadow); }
/* Konvexglas: Fläche, Rand und Glanz kommen ausschliesslich aus dem Shader */
.glass-card.glass-card--live { background: none !important; border-color: transparent !important; -webkit-backdrop-filter: none !important; backdrop-filter: none !important; }
.glass-card.glass-card--fallback { background: linear-gradient(170deg, rgba(255, 226, 180, .10), rgba(35, 20, 9, .35)) !important; -webkit-backdrop-filter: blur(7px) brightness(.7) saturate(1.2) !important; backdrop-filter: blur(7px) brightness(.7) saturate(1.2) !important; border: 1px solid rgba(255, 225, 180, .28) !important; }
.glass-off .glass-card > .glass-card__surface, .glass-card:not(.glass-card--live) > .glass-card__surface { display: none; }
.gl :is(b, small, p, span, h2, h3, li, label, a, dd, dt) { text-shadow: 0 1px 3px rgba(0, 0, 0, .45); }

/* Knöpfe, Chips, Eingaben */

  background: rgba(10, 8, 7, .55) !important; border: 1px solid rgba(255, 255, 255, .16) !important; color: var(--ink); border-radius: 12px; }

/* Kopf (Handy) und Navigation */
.top { position: relative; top: auto; background: none; border-bottom: 0; margin-bottom: 8px; }

.plusbtn { color: var(--gold2); }
/* Leiste unten: schwebend, möglichst nah am unteren Rand (über dem Home-Balken des iPhones nur so weit wie nötig) */

body { padding-bottom: calc(92px + env(safe-area-inset-bottom, 0px)); }

  .side { background: var(--glass); border-right: 0; top: 12px; bottom: 12px; left: 12px; border-radius: 22px; }

}

/* Unterseiten */

.panel, .entry, .morelist, .kt, .shoplist, .lpanel, .seg2, .sfield, .empty, .unknown, .todo, .band, .note-box, .callout, details.fold, .rows-box, .shopsel .it, .key-dialog { border-radius: var(--radius); }

/* Rezeptzeilen: innerhalb einer Glasfläche ohne eigenen Rahmen */

.foldwrap > details.fold { margin-top: 0; background: none; border: 0; }

<script>
/* ---------- GlassCard: konvexes, dunkles Klarglas (WebGL) ----------
   Portiert die Referenz «Convex Gloss Glass» (blur 7, refraction 32, gloss 85, tint 20) als Fragment-Shader.
   Jede Glasfläche (.glass-card) tastet den Teil des Hintergrunds (#stage oder ein Foto daneben) ab, der hinter ihr liegt:
   Mitte unscharf, zum Rand hin verzerrt, Glanz aus der Wölbung berechnet, warm-dunkel getönt. Ohne WebGL: mattes Glas (CSS). */
(function (global) {
  "use strict";
  const DEF = { blur: 7, refraction: 32, gloss: 85, tint: 20, darken: 35 };
  const VS = "attribute vec2 a;void main(){gl_Position=vec4(a,0.,1.);}";
  const FS = `
precision highp float;
uniform sampler2D uTex;
uniform vec2 uSize; uniform vec2 uCard; uniform vec4 uBg;
uniform float uDpr, uRadius, uBevel, uBlur, uRef, uGloss, uTint, uH, uDark;
uniform vec3 uTintCol;
float sdf(vec2 p, vec2 h, float r){ vec2 q = abs(p) - h + r; return length(max(q,0.)) + min(max(q.x,q.y),0.) - r; }
vec3 tex(vec2 css){ vec2 uv = (css - uBg.xy) / uBg.zw; return texture2D(uTex, clamp(uv, vec2(0.001), vec2(0.999))).rgb; }
vec3 blurred(vec2 css){
  if (uBlur < 0.5) return tex(css);
  vec3 acc = tex(css); float wsum = 1.;
  for (int i = 1; i < 28; i++) {
    float fi = float(i); float r = sqrt(fi / 28.) * uBlur * 2.5; float a = fi * 2.39996;
    float w = exp(-(r*r) / (2.*uBlur*uBlur));
    acc += tex(css + vec2(cos(a), sin(a)) * r) * w; wsum += w;
  }
  return acc / wsum;
}
void main(){
  vec2 p = vec2(gl_FragCoord.x, uH - gl_FragCoord.y) / uDpr;
  vec2 hs = uSize * .5; vec2 pc = p - hs;
  float d = sdf(pc, hs, uRadius);
  if (d > 0.) { gl_FragColor = vec4(0.); return; }
  float edge = -d, t = max(0., 1. - edge / uBevel);
  float nx = sdf(pc + vec2(.5,0.), hs, uRadius) - sdf(pc - vec2(.5,0.), hs, uRadius);
  float ny = sdf(pc + vec2(0.,.5), hs, uRadius) - sdf(pc - vec2(0.,.5), hs, uRadius);
  float slope = sin(t * 1.49), nz = sqrt(max(.01, 1. - slope*slope));
  vec2 dd = vec2(nx, ny) * uRef * pow(t, .8) + pc * .055;
  vec2 s = uCard + p + dd;
  float fres = pow(1. - nz, 3.);
  float spec1 = pow(max(0., nx*slope*(-.43) + ny*slope*(-.79) + nz*.44), 34.);
  float spec2 = pow(max(0., nx*slope*.46 + ny*slope*.79 + nz*.4), 24.);
  float rim = exp(-pow((edge - 1.5) / 1.1, 2.));
  float shine = uGloss * (spec1*.95 + spec2*.65 + fres*.16 + rim*.27);
  float mixv = min(.88, t*t*.8);
  vec3 v = blurred(s) * (1. - mixv) + tex(s) * mixv;
  v = v * (1. - uTint*.7) + uTintCol * uTint;
  v *= (1. - uDark);
  v += shine * vec3(255.,215.,157.)/255.;
  v -= exp(-pow((edge - 5.) / 2.5, 2.)) * 16. / 255.;
  float alpha = min(1., edge + .5);
  gl_FragColor = vec4(clamp(v, 0., 1.) * alpha, alpha);
}`;
  let gl = null, glCanvas = null, loc = {}, ok = null, enabled = true, maxDim = 4096, raf = 0;
  const cards = new Set();
  const texCache = new Map();
  function initGL() {
    if (ok !== null) return ok;
    try {
      glCanvas = document.createElement("canvas");
      gl = glCanvas.getContext("webgl", { premultipliedAlpha: true, preserveDrawingBuffer: true, alpha: true });
      if (!gl) return (ok = false);
      const sh = (type, src) => { const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s);
        if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s)); return s; };
      const prog = gl.createProgram();
      gl.attachShader(prog, sh(gl.VERTEX_SHADER, VS)); gl.attachShader(prog, sh(gl.FRAGMENT_SHADER, FS));
      gl.linkProgram(prog); if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) throw new Error("link");
      gl.useProgram(prog);
      const buf = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, buf);
      gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 1,-1, -1,1, 1,1]), gl.STATIC_DRAW);

const GH = { owner: "KiraDarth", repo: "Family-cookbook", branch: "main", dir: "data" };
const TOKEN_KEY = "kochbuch-github-schluessel";

      if (res.status === 401) { setGhToken(""); throw new Error("Der GitHub-Schlüssel ist ungültig oder abgelaufen"); }

        if (cur.sha) body.sha = cur.sha;

/* ---------- Zutatenliste (Regelwerk aus data/zutaten.json) ---------- */
let ZI = null;
// Haupt-Oberbegriff plus weitere (auchUnter), damit eine Zutat unter mehreren gefunden wird
function oberbegriffe(e) { return [e.oberbegriff, ...(e.auchUnter || [])].filter(Boolean); }
function zIndex() {
  if (ZI || !Z) return ZI;
  const byName = new Map(), bySpell = new Map();
  for (const e of Z.zutaten || []) { byName.set(e.name, e); bySpell.set(e.name.toLowerCase(), e); for (const x of e.schreibweisen || []) bySpell.set(x.toLowerCase(), e); }
  ZI = { byName, bySpell };
  return ZI;
}
function zutatNamen() {
  if (!Z) return [];
  return [...new Set((Z.zutaten || []).flatMap(e => [e.name.replace(/ \(.*\)$/, ""), ...(e.schreibweisen || []).filter(x => !x.includes(","))]))].sort((a, b) => a.localeCompare(b, "de"));
}
// Ordnet eine Rezeptzutat einem Eintrag der Zutatenliste zu, mit Alternativen
function resolveIng(rid, i) {
  const nm = (i.name || "").trim();
  if (!nm || /^wasser$/i.test(nm)) return { skip: true };
  const ix = zIndex();
  if (!ix) return { entry: null, alts: [], unknown: true };
  const withNote = i.note ? `${nm}, ${i.note}` : "";
  const spell = withNote && ix.bySpell.has(withNote.toLowerCase()) ? withNote : nm;
  let entry = null; const alts = [];
  const v = Z.varianten?.[spell];
  if (v) { entry = ix.byName.get(v.zutat) || null; v.alt.forEach(a => { const e = ix.byName.get(a); if (e) alts.push(e); }); }
  else entry = ix.bySpell.get(spell.toLowerCase()) || null;
  for (const ra of Z.rezeptAlternativen || []) {
    if (ra.rezept !== rid || ra.schreibweise.toLowerCase() !== nm.toLowerCase()) continue;
    ra.alt.forEach(a => {
      if (a.startsWith("@")) (Z.zutaten || []).filter(e => oberbegriffe(e).includes(a.slice(1)) && e !== entry).forEach(e => alts.push(e));
      else { const e = ix.byName.get(a); if (e && e !== entry) alts.push(e); }
    });
  }
  return { entry, alts: [...new Set(alts)], unknown: !entry && !i.recipeId };
}
function unknownIngredients() {
  if (!Z) return [];
  const m = new Map();
  recipes.forEach(r => (r.ingredients || []).forEach(i => { if (i.heading != null || i.recipeId) return; const x = resolveIng(r.id, i); if (x.unknown) { if (!m.has(i.name)) m.set(i.name, new Set()); m.get(i.name).add(r.title); } }));
  return [...m].map(([n, t]) => [n, [...t]]);
}

function parseIngLine(line) {
  const t = line.trim();
  if (!t) return null;
  if (/:$/.test(t)) return { heading: t.replace(/:$/, "").trim() };
  const m = t.match(/^([\d½¼¾⅓⅔⅛][\d½¼¾⅓⅔⅛.,/\s–-]*)?\s*(?:([A-Za-zÄÖÜäöü]+)\.?\s+)?(.*)$/);
  let amount = "", unit = "", rest = t;
  if (m) {
    amount = (m[1] || "").trim();
    if (m[2] && UNITS.some(u => u.toLowerCase() === m[2].toLowerCase())) { unit = UNITS.find(u => u.toLowerCase() === m[2].toLowerCase()); rest = m[3]; }
    else rest = ((m[2] ? m[2] + " " : "") + m[3]).trim();
  }
  const [name, ...note] = rest.split(",");
  return { amount, unit, name: name.trim(), note: note.join(",").trim() };
}
// Zubereitung aus dem Textfeld: «Titel:» = Abschnitt, «Tipp: …» = Tipp zum Schritt darüber
function parseSteps(text) {
  const steps = [], stepTips = {};
  for (const line of text.split("\n").map(x => x.trim()).filter(Boolean)) {
    const tm = line.match(/^tipp\s*:\s*(.+)$/i);
    if (tm && steps.length && !isHead(steps[steps.length - 1])) { const k = steps.length - 1; stepTips[k] = stepTips[k] ? stepTips[k] + "\n" + tm[1] : tm[1]; continue; }
    steps.push(/:$/.test(line) && line.length < 60 ? "## " + line.replace(/:$/, "").trim() : line);
  }
  return { steps, stepTips };
}
function collectForm() {
  const v = id => (document.getElementById(id)?.value || "").trim();
  const ingredients = [...document.querySelectorAll("#f-ings .ing-row")].map(row => {
    if (row.classList.contains("heading")) { const h = row.querySelector(".i-heading").value.trim(); return h ? { heading: h } : null; }
    const g = c => row.querySelector(c).value.trim();
    const i = { amount: g(".i-amount"), unit: g(".i-unit"), name: g(".i-name"), note: g(".i-note") };
    const o = parseOrig(g(".i-orig")); if (o) i.orig = o;
    if (row.dataset.rid) i.recipeId = row.dataset.rid;
    return i.name || i.amount ? i : null;
  }).filter(Boolean);
  return {
    title: v("f-title"), intro: v("f-intro"), servings: Number(v("f-servings")) || 0, yieldUnit: v("f-yield") || "Portionen",
    time: v("f-time"), prepTime: v("f-prep"), restTime: v("f-rest"), cookTime: v("f-cook"),
    chapter: v("f-chapter"), subchapter: v("f-sub"), section: v("f-sub") ? v("f-section") : "", keywords: v("f-keywords").split(",").map(x => x.trim()).filter(Boolean),
    photoNote: v("f-pnote"), photoNotePos: v("f-ppos") || "unten-rechts", topics: [...document.querySelectorAll("#f-topics [aria-pressed=true]")].map(b => b.dataset.tgl),
    ingredients, ...parseSteps(v("f-steps")), tips: v("f-tips"), source: v("f-source"),
    restVon: v("f-restvon")
  };
}
async function saveForm() {
  const r = route();
  const msg = document.getElementById("form-msg");
  const btn = document.getElementById("save");
  const data = collectForm();
  const why = (document.getElementById("f-why")?.value || "").trim();
  const variantNote = document.getElementById("f-variant") ? document.getElementById("f-variant").value.trim() : null;
  if (!data.title) { msg.textContent = "Bitte gib dem Rezept einen Titel."; document.getElementById("f-title").focus(); return; }
  if (r.mode === "variant" && !variantNote) { msg.textContent = "Beschreib kurz, was bei der Variante anders ist."; document.getElementById("f-variant").focus(); return; }
  const src = r.mode !== "new" ? byId(r.id) : null;
  const confirmedEdit = r.mode === "edit" && src?.status === "bestaetigt";
  const contentChanged = confirmedEdit && diff(snap(src), snap(data)).length > 0;
  if (contentChanged && !why) { msg.textContent = "Schreib kurz auf, was du geändert hast. Das erscheint im Verlauf."; document.getElementById("f-why").focus(); return; }
  msg.textContent = ""; btn.disabled = true; btn.textContent = "Speichert …";
  const now = new Date().toISOString();
  try {
    if (pendingPhoto === "remove") data.photo = "";
    else if (pendingPhoto) {
      btn.textContent = "Foto wird hochgeladen …";
      const slug = (data.title || "rezept").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "").slice(0, 40);
      data.photo = await db.putFile(`images/${slug}-${Date.now().toString(36)}.jpg`, pendingPhoto.base64, `Foto: ${data.title}`);
      btn.textContent = "Speichert …";
    } else if (src?.photo && r.mode === "edit") data.photo = src.photo;
    if (r.mode === "edit") {
      const changes = diff(snap(src), snap(data));
      const upd = { ...data, updatedAt: now };
      if (variantNote !== null) upd.variantNote = variantNote;
      if (confirmedEdit && changes.length) {
        await db.collection("history").add({ recipeId: src.id, at: now, type: "aenderung", note: why, prev: snap(src), snapshot: snap(data) });
        upd.historyCount = (src.historyCount || 0) + 1;
      }
      await db.doc("recipes/" + src.id).update(upd);
      if (pendingPhoto && pendingPhoto !== "remove") localPhotos[src.id] = pendingPhoto.dataUrl;
      pendingPhoto = null;
      location.hash = "r-" + src.id;
    } else {
      const doc = { ...data, status: "entwurf", createdAt: now, updatedAt: now, historyCount: 0 };
      if (r.mode === "variant") { doc.parentId = src.id; doc.variantNote = variantNote; }
      const ref = await db.collection("recipes").add(doc);
      if (pendingPhoto && pendingPhoto !== "remove") localPhotos[ref.id] = pendingPhoto.dataUrl;
      pendingPhoto = null;
      location.hash = "r-" + ref.id;
    }
  } catch (e) {
    btn.disabled = false; btn.textContent = "Erneut speichern";
    msg.textContent = "Speichern hat nicht geklappt (" + (e?.message || e?.code || "unbekannter Fehler") + "). Deine Eingaben sind noch da, versuch es gleich nochmal.";
  }
}

/* ---------- history ---------- */
function renderHistory(id) {
  const r = byId(id);
  if (!r) return notFound();
  if (historyFor !== id) {
    if (historyUnsub) historyUnsub();
    historyFor = id; historyLoaded = false; historyEntries = [];
    historyUnsub = db.collection("history").where("recipeId", "==", id).limit(500).onSnapshot(s => {
      historyEntries = s.docs.map(d => ({ id: d.id, ...d.data() })).sort((a, b) => (b.at || "").localeCompare(a.at || ""));
      historyLoaded = true;
      if (route().view === "history" && route().id === id) renderHistory(id);
    }, () => { historyLoaded = true; renderHistory(id); });
  }
  const label = { bestaetigt: "Als korrekt bestätigt", aenderung: "Geändert", wiederhergestellt: "Älteren Stand wiederhergestellt" };
  const baseline = [...historyEntries].reverse().find(e => e.type === "bestaetigt");
  const total = baseline ? diff(baseline.snapshot, snap(r)) : [];
  const entries = historyEntries.map((e, idx) => `<li class="entry">
      <div class="entry-head"><h3>${esc(label[e.type] || "Änderung")}</h3><time datetime="${esc(e.at)}">${esc(fmtDate(e.at))}</time></div>
      ${e.note ? `<p class="why">„${esc(e.note)}“</p>` : ""}
      ${e.type === "bestaetigt" ? `<p class="muted" style="margin:0">Ausgangsversion mit ${e.snapshot.ingredients.filter(i => i.heading == null).length} Zutaten und ${e.snapshot.steps.length} Schritten. Ab hier beginnt der Verlauf.</p>` : diffHtml(diff(e.prev, e.snapshot))}
      ${idx > 0 ? `<div><button class="btn small" data-action="restore" data-entry="${esc(e.id)}">Diesen Stand wiederherstellen</button></div>` : `<div><span class="pill ok">Aktueller Stand</span></div>`}
    </li>`).join("");
  app.innerHTML = `
    <nav class="crumbs"><a href="#r-${esc(id)}">← ${esc(r.title)}</a></nav>
    <header class="recipe-head"><span class="eyebrow">Verlauf</span><h1>${esc(r.title)}</h1>
      <p class="lede">Alle Änderungen seit der Bestätigung, die neueste zuerst.</p></header>
    ${!historyLoaded ? `<p class="loading">Verlauf wird geladen …</p>` : `
      ${baseline && historyEntries.length > 1 ? `<section class="panel" style="margin-bottom:20px"><h2>Insgesamt seit der Bestätigung</h2>${diffHtml(total)}</section>` : ""}
      ${entries ? `<ol class="timeline">${entries}</ol>` : `<div class="empty"><p>Noch keine Einträge.</p></div>`}`}`;
}
async function restore(entryId) {
  const r = byId(historyFor); const e = historyEntries.find(x => x.id === entryId);
  if (!r || !e) return;
  const now = new Date().toISOString();
  await db.collection("history").add({ recipeId: r.id, at: now, type: "wiederhergestellt", note: `Stand vom ${fmtDate(e.at)}`, prev: snap(r), snapshot: snap(e.snapshot) });
  await db.doc("recipes/" + r.id).update({ ...snap(e.snapshot), topics: [...(r.topics || [])], source: r.source || "", updatedAt: now, historyCount: (r.historyCount || 0) + 1 });
}

/* ---------- actions ---------- */
async function confirmRecipe(id) {
  const r = byId(id); if (!r) return;
  const now = new Date().toISOString();
  await db.collection("history").add({ recipeId: id, at: now, type: "bestaetigt", note: "", snapshot: snap(r) });
  await db.doc("recipes/" + id).update({ status: "bestaetigt", confirmedAt: now, updatedAt: now, historyCount: 1 });
}
async function deleteRecipe(id) {
  const hs = await db.collection("history").where("recipeId", "==", id).limit(1000).get();
  for (const d of hs.docs) await db.doc("history/" + d.id).delete();
  await db.doc("recipes/" + id).delete();
  confirmDelete = false; location.hash = "";
}
async function backup(btn) {
  btn.disabled = true; const old = btn.textContent; btn.textContent = "Wird erstellt …";
  try {
    const hs = await db.collection("history").limit(1000).get();
    const data = { exportiert: new Date().toISOString(), rezepte: recipes, verlauf: hs.docs.map(d => ({ id: d.id, ...d.data() })) };
    const a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob([JSON.stringify(data, null, 2)], { type: "application/json" }));
    a.download = `kochbuch-sicherung-${new Date().toISOString().slice(0, 10)}.json`;
    document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 5000);
    btn.textContent = old;
  } catch (e) { btn.textContent = e?.code === "declined" ? old : "Download fehlgeschlagen"; }
  finally { btn.disabled = false; }
}
async function setWake(on) {
  try {
    if (on) { wakeLock = await navigator.wakeLock.request("screen"); wakeLock.addEventListener?.("release", () => { wakeLock = null; const c = document.getElementById("wake"); if (c) c.checked = false; }); }
    else releaseWake();
  } catch { const c = document.getElementById("wake"); if (c) c.checked = false; wakeLock = null; }
}
function releaseWake() { try { wakeLock?.release(); } catch {} wakeLock = null; }

app.addEventListener("click", async ev => {
  const t = ev.target.closest("button, [data-action]");
  if (!t) return;
  const r = route();
  if (t.dataset.nav) return navAction(t);
  if (t.dataset.tgl) { t.setAttribute("aria-pressed", t.getAttribute("aria-pressed") !== "true"); return; }
  const a = t.dataset.action;
  if (!a) return;
  if (a === "back") { if (inAppNav > 0) history.back(); else location.hash = t.dataset.fallback || ""; return; }
  if (a === "open-search") { state.focusSearch = true; return growTo(t, "rezepte", getComputedStyle(document.body).backgroundColor); }
  if (a === "shop-add") { const ex = shop.items.find(x => x.id === r.id); const n = Number(t.dataset.servings) || 1; if (ex) ex.servings = n; else shop.items.push({ id: r.id, servings: n }); saveShop(); renderNav(); toast(ex ? "Menge auf der Einkaufsliste angepasst." : "Auf die Einkaufsliste gesetzt."); return renderDetail(r.id); }
  if (a === "shop-inc" || a === "shop-dec") { const it = shop.items.find(x => x.id === t.dataset.id); const rr = byId(t.dataset.id); if (!it || !rr) return; const base = Number(rr.servings) || 1; const step = base >= 50 ? 10 : 1; it.servings = Math.max(step, it.servings + (a === "shop-inc" ? step : -step)); saveShop(); return renderShop(); }
  if (a === "shop-rm") { shop.items = shop.items.filter(x => x.id !== t.dataset.id); saveShop(); renderNav(); return renderShop(); }
  if (a === "shop-clear") { state.confirmClear = true; return renderShop(); }
  if (a === "shop-clear-no") { state.confirmClear = false; return renderShop(); }
  if (a === "shop-clear-yes") { shop = { items: [], checked: {} }; state.confirmClear = false; saveShop(); renderNav(); return renderShop(); }
  if (a === "shop-share") return shareShop(t);
  if (a === "list-panel") { state.listPanel = !state.listPanel; return renderDetail(r.id); }
  if (a === "list-toggle") { const l = lists.find(x => x.id === t.dataset.list); if (!l) return; const ids = new Set(l.recipeIds || []); ids.has(r.id) ? ids.delete(r.id) : ids.add(r.id); t.disabled = true; return saveList(l.id, { recipeIds: [...ids] }); }
  if (a === "list-new") { const inp = document.getElementById("new-list-name"); const name = (inp?.value || "").trim(); if (!name) { inp?.focus(); return; } t.disabled = true; try { await db.collection("lists").add({ title: name, recipeIds: t.dataset.with ? [t.dataset.with] : [], createdAt: new Date().toISOString() }); toast(`Liste „${name}“ angelegt.`); } catch (e) { toast(e?.message || "Speichern hat nicht geklappt."); t.disabled = false; } return; }
  if (a === "list-rm") { const l = lists.find(x => x.id === r.id); if (!l) return; return saveList(l.id, { recipeIds: (l.recipeIds || []).filter(x => x !== t.dataset.id) }); }
  if (a === "list-rename") { const l = lists.find(x => x.id === r.id); const tb = t.closest(".toolbar"); tb.insertAdjacentHTML("afterend", `<div class="inline-new" style="margin-top:10px"><input id="rename-list" value="${esc(l.title)}" aria-label="Neuer Name"><button type="button" class="btn small primary" data-action="list-rename-save">Speichern</button></div>`); t.remove(); document.getElementById("rename-list").focus(); return; }
  if (a === "list-rename-save") { const v = document.getElementById("rename-list").value.trim(); if (v) return saveList(r.id, { title: v }); return; }
  if (a === "list-del") { state.confirmListDel = true; return renderListDetail(r.id); }
  if (a === "list-del-no") { state.confirmListDel = false; return renderListDetail(r.id); }
  if (a === "list-del-yes") { t.disabled = true; try { await db.doc("lists/" + r.id).delete(); state.confirmListDel = false; location.hash = "listen"; } catch (e) { toast(e?.message || "Löschen hat nicht geklappt."); t.disabled = false; } return; }
  if (a === "have-add") { const inp = document.getElementById("have-input"); const v = (inp.value || "").trim(); if (v && !have.some(x => x.toLowerCase() === v.toLowerCase())) { have.push(v); saveHave(); } renderHave(); document.getElementById("have-input").focus(); return; }
  if (a === "have-rm") { have = have.filter(x => x !== t.dataset.have); saveHave(); return renderHave(); }
  if (a === "have-clear") { have = []; saveHave(); return renderHave(); }
  if (a === "filter") { const k = t.dataset.kind, v = t.dataset.v, l = state.filter[k]; state.filter[k] = l.includes(v) ? l.filter(x => x !== v) : [...l, v]; return renderResults(); }
  if (a === "filter-reset") { state.filter = { topics: [], chapters: [] }; return renderResults(); }
  if (a === "kt") { const k = t.closest(".kt"); k.classList.toggle("open"); t.setAttribute("aria-expanded", k.classList.contains("open")); return; }
  const rec = r.id ? byId(r.id) : null;
  if (a === "glass-konvex" || a === "glass-matt") { setGlassMode(a === "glass-konvex" ? "konvex" : "matt"); return renderMore(); }
  if (a === "tab") return switchTab(r.id, t.dataset.tab);
  if (a === "step") return toggleStep(r.id, t.closest(".stile"));
  if (a === "tip") { const w = t.closest(".stile").querySelector(".tipwrap"); const open = !w.classList.contains("open"); w.classList.toggle("open", open); t.setAttribute("aria-expanded", open); return; }
  if (a === "cook-reset") { const c = cookOf(r.id); c.ing = []; c.st = []; saveCook(r.id, c); return renderDetail(r.id); }
  if (a === "units-metric" || a === "units-orig") { setOrigMode(a === "units-orig"); return renderDetail(r.id); }
  if (a === "less" || a === "more" || a === "base") {
    const base = Number(rec.servings) || 1, cur = servingsFor[r.id] || base;
    const step = base >= 50 ? 10 : 1;
    servingsFor[r.id] = a === "base" ? base : Math.max(step, cur + (a === "more" ? step : -step));
    return renderDetail(r.id);
  }
  if (a === "confirm") { t.disabled = true; t.textContent = "Wird bestätigt …"; try { await confirmRecipe(r.id); } catch (e) { t.disabled = false; t.textContent = "Nochmal versuchen"; } return; }
  if (a === "delete") { confirmDelete = true; return renderDetail(r.id); }
  if (a === "delete-no") { confirmDelete = false; return renderDetail(r.id); }
  if (a === "delete-yes") { t.disabled = true; t.textContent = "Wird gelöscht …"; try { await deleteRecipe(r.id); } catch { t.disabled = false; t.textContent = "Nochmal versuchen"; } return; }
  if (a === "restore") { t.disabled = true; t.textContent = "Wird wiederhergestellt …"; try { await restore(t.dataset.entry); } catch { t.disabled = false; t.textContent = "Nochmal versuchen"; } return; }
  if (a === "rm-ing") { t.closest(".ing-row").remove(); return; }
  if (a === "rm-photo") { pendingPhoto = "remove"; const im = document.getElementById("f-photo-prev"); im.hidden = true; im.removeAttribute("src"); t.hidden = true; return; }
  if (a === "add-ing" || a === "add-head") {
    document.getElementById("f-ings").insertAdjacentHTML("beforeend", ingRowHtml(a === "add-head" ? { heading: "" } : {}));
    document.querySelector("#f-ings .ing-row:last-child input").focus(); return;
  }
  if (a === "bulk") {
    const ta = document.getElementById("f-bulk");
    const rows = ta.value.split("\n").map(parseIngLine).filter(Boolean);
    const box = document.getElementById("f-ings");
    [...box.querySelectorAll(".ing-row:not(.heading)")].forEach(row => { if (![...row.querySelectorAll("input")].some(i => i.value.trim())) row.remove(); });
    box.insertAdjacentHTML("beforeend", rows.map(ingRowHtml).join(""));
    ta.value = ""; t.closest("details").open = false; return;
  }
  if (a === "add-topic") {
    const inp = document.getElementById("f-newtopic"); const v = inp.value.trim(); if (!v) return;
    const box = document.getElementById("f-topics");
    const ex = [...box.querySelectorAll("[data-tgl]")].find(b => b.dataset.tgl.toLowerCase() === v.toLowerCase());
    if (ex) ex.setAttribute("aria-pressed", "true");
    else box.insertAdjacentHTML("beforeend", `<button type="button" class="chip" data-tgl="${esc(v)}" aria-pressed="true"><span class="dot"></span>${esc(v)}</button>`);
    inp.value = ""; return;
  }
});
app.addEventListener("click", ev => {
  const g = ev.target.closest("a[data-grow]");
  if (g && !ev.metaKey && !ev.ctrlKey) { ev.preventDefault(); return growTo(g, g.getAttribute("href").slice(1), getComputedStyle(g).backgroundColor); }
  const ls = ev.target.closest("a[data-action=list-to-shop]");
  if (ls) { const l = lists.find(x => x.id === route().id); (l?.recipeIds || []).map(byId).filter(Boolean).forEach(r => { if (!shop.items.some(x => x.id === r.id)) shop.items.push({ id: r.id, servings: Number(r.servings) || 1 }); }); saveShop(); renderNav(); return; }
  const j = ev.target.closest("a[data-jump]");
  if (j) { ev.preventDefault(); document.getElementById("g-" + j.dataset.jump)?.scrollIntoView({ behavior: reducedMotion() ? "auto" : "smooth", block: "start" }); }
}, true);
/* ---------- Rezept beim Kochen: Reiter, Abhaken, Position ---------- */
function updateProgress(id) {
  const el = document.getElementById("cook-progress"); if (!el) return;
  const c = cookOf(id);
  el.innerHTML = progressText(c.ing.length, app.querySelectorAll("#p-zut input[data-ing]").length, c.st.length, app.querySelectorAll("#p-zub .stile[data-si]").length);
}
function toggleStep(id, st) {
  if (!st) return;
  const i = Number(st.dataset.si), c = cookOf(id), s = new Set(c.st);
  const done = !s.has(i); done ? s.add(i) : s.delete(i);
  c.st = [...s]; saveCook(id, c);
  st.classList.toggle("done", done); st.querySelector(".cb")?.setAttribute("aria-pressed", done);
  if (done) { st.querySelector(".tipwrap")?.classList.remove("open"); st.querySelector(".tipbtn")?.setAttribute("aria-expanded", "false"); }
  updateProgress(id);
}
// Erledigten Schritt antippen holt ihn zurück
app.addEventListener("click", ev => {
  const st = ev.target.closest(".stile.done");
  if (!st || ev.target.closest("a, button")) return;
  toggleStep(route().id, st);
});
function tabsTop() { const w = app.querySelector(".rtabs-wrap"); return w ? w.getBoundingClientRect().top + scrollY - 6 : 0; }
function switchTab(id, tab) {
  const c = cookOf(id); if (c.tab === tab) return;
  c.y[c.tab] = scrollY; c.tab = tab; saveCook(id, c);
  app.querySelectorAll(".rtabs [data-tab]").forEach(b => b.setAttribute("aria-selected", b.dataset.tab === tab));
  document.getElementById("p-zut").classList.toggle("off", tab !== "zut"); document.getElementById("p-zub").classList.toggle("off", tab !== "zub");
  const top = tabsTop(), y = c.y[tab];
  window.scrollTo(0, y != null ? Math.max(y, Math.min(scrollY, top)) : Math.min(scrollY, top));
}
// Position im aktiven Reiter merken
let ySave = 0;
addEventListener("scroll", () => {
  clearTimeout(ySave);
  ySave = setTimeout(() => { const rt = route(); if (rt.view !== "detail" || !app.querySelector(".rtabs")) return; const c = cookOf(rt.id); c.y[c.tab] = scrollY; saveCook(rt.id, c); }, 250);
}, { passive: true });

function navAction(t) {
  if (t.dataset.nav === "backup") return backup(t);
  if (t.dataset.nav === "key") return openKeyDialog();
}
document.getElementById("side").addEventListener("click", ev => { const t = ev.target.closest("[data-nav]"); if (t) navAction(t); });
async function saveList(id, data) {
  try { await db.doc("lists/" + id).update({ ...data, updatedAt: new Date().toISOString() }); }
  catch (e) { toast(e?.message || "Speichern hat nicht geklappt."); render(); }
}
app.addEventListener("change", ev => {
  const t = ev.target;
  if (t.dataset.shop != null) { t.checked ? shop.checked[t.dataset.shop] = true : delete shop.checked[t.dataset.shop]; saveShop(); t.closest("li").classList.toggle("done", t.checked); return; }
  if (t.dataset.ing != null) {
    const id = route().id; const c = cookOf(id); const s = new Set(c.ing); const i = Number(t.dataset.ing);
    t.checked ? s.add(i) : s.delete(i); c.ing = [...s]; saveCook(id, c); t.closest("li").classList.toggle("done", t.checked); updateProgress(id);
  }
  if (t.id === "wake") setWake(t.checked);
  if (t.id === "f-photo" && t.files?.[0]) preparePhoto(t.files[0]);
});
// Foto im Browser verkleinern (lange Seite max. 2400 px, reicht für Druck in A4-Breite)
async function preparePhoto(file) {
  const msg = document.getElementById("form-msg");
  try {
    const bmp = await createImageBitmap(file, { imageOrientation: "from-image" });
    const k = Math.min(1, 2400 / Math.max(bmp.width, bmp.height));
    const c = document.createElement("canvas"); c.width = Math.round(bmp.width * k); c.height = Math.round(bmp.height * k);
    c.getContext("2d").drawImage(bmp, 0, 0, c.width, c.height);
    const dataUrl = c.toDataURL("image/jpeg", 0.85);
    pendingPhoto = { dataUrl, base64: dataUrl.split(",")[1] };
    const im = document.getElementById("f-photo-prev"); im.src = dataUrl; im.hidden = false;
    const rm = document.querySelector("[data-action=rm-photo]"); if (rm) rm.hidden = false;
    msg.textContent = "";
  } catch { msg.textContent = "Dieses Foto konnte nicht gelesen werden. Versuch es mit einem JPG oder PNG."; }
}
app.addEventListener("input", ev => { if (ev.target.id === "q") { state.q = ev.target.value; renderResults(); } });
app.addEventListener("submit", ev => { ev.preventDefault(); saveForm(); });
app.addEventListener("keydown", ev => {
  if (ev.key === "Enter" && ev.target.id === "have-input") { ev.preventDefault(); document.querySelector("[data-action=have-add]").click(); }
  if (ev.key === "Enter" && ev.target.id === "new-list-name") { ev.preventDefault(); document.querySelector("[data-action=list-new]").click(); }
  if (ev.key === "Enter" && ev.target.id === "rename-list") { ev.preventDefault(); document.querySelector("[data-action=list-rename-save]").click(); }
});
app.addEventListener("keydown", ev => { if (ev.target.id === "f-newtopic" && ev.key === "Enter") { ev.preventDefault(); document.querySelector("[data-action=add-topic]").click(); } });

// Zählt Schritte innerhalb der App, damit „Zurück“ nicht aus der App hinausführt
let inAppNav = 0;
try { if (typeof history.state?.d !== "number") history.replaceState({ d: 0 }, ""); else inAppNav = history.state.d; } catch {}
window.addEventListener("hashchange", () => {
  try { if (typeof history.state?.d === "number") inAppNav = history.state.d; else { inAppNav++; history.replaceState({ d: inAppNav }, ""); } } catch {}
  builtRoute = null; confirmDelete = false; render();
  const rt = route(); const y = rt.view === "detail" ? cookOf(rt.id).y[cookOf(rt.id).tab] : 0;
  window.scrollTo(0, y || 0);
});

/* ---------- boot ---------- */
(async () => {
  const timer = setTimeout(() => { if (!loaded) { loadErr = "timeout"; render(); } }, 10000);
  db = makeGitHubDb();
  db.startSync();
  db.collection("recipes").limit(1000).onSnapshot(s => {
    clearTimeout(timer); loaded = true; loadErr = null;
    recipes = s.docs.map(d => ({ id: d.id, ...d.data() }));
    render();
  }, e => { clearTimeout(timer); loadErr = e?.message || e?.code || "error"; render(); });
  db.collection("lists").limit(500).onSnapshot(s => {
    lists = s.docs.map(d => ({ id: d.id, ...d.data() })); listsLoaded = true;
    const v = route().view; if (loaded && ["lists", "list", "detail"].includes(v)) render();
  }, () => { listsLoaded = true; });
  fetch("data/zutaten.json?t=" + Date.now(), { cache: "no-store" }).then(r => r.ok ? r.json() : null).then(z => { Z = z; ZI = null; if (loaded && route().view !== "edit") render(true); }).catch(() => {});
})();
